[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "token-save-mcp"
version = "0.1.1"
description = "MCP server that keeps large files out of your coding agent's context by delegating reads to a cheap worker model. Enforced by a hook, measured per call."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
keywords = [
    "mcp", "model-context-protocol", "claude-code", "claude", "cursor",
    "llm", "token-optimization", "context-window", "ai-coding",
    "developer-tools", "openrouter", "ollama",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
]
dependencies = [
    "mcp>=1.2",
    "openai>=1.60",
]

[project.urls]
Homepage = "https://github.com/Habartru/token_save_mcp"
Issues = "https://github.com/Habartru/token_save_mcp/issues"

[project.scripts]
token-save-mcp = "token_save_mcp.cli:main"
token-save-mcp-server = "token_save_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/token_save_mcp"]

[tool.hatch.build.targets.wheel.force-include]
"hooks/check-file-size" = "token_save_mcp/hooks/check-file-size"
